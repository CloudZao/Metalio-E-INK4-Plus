<!DOCTYPE html>
<html lang="zh-CN">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CloudZao文件管理</title>
<style>
:root{--bg:#f5f5f5;--card:#fff;--ink:#202020;--muted:#707070;--line:#e7e7e7;--mark:#f0f0f0;--green:#C8F24D;--field:#f5f5f5;--press:#eeeeee;--accent:#303030;--on-green:#20240f;--danger:#b63f38;--error-bg:#fcf2f1;--shade:0 2px 8px rgba(0,0,0,.04)}
html[data-theme="night"]{color-scheme:dark;--bg:#121212;--card:#1e1e1e;--ink:#eeeeee;--muted:#a4a4a4;--line:#333;--mark:#2b2b2b;--field:#282828;--press:#303030;--accent:#dedede;--danger:#f0a29a;--error-bg:#352725;--shade:none}
*{box-sizing:border-box}
button,input,select{font-family:inherit}
body{margin:0;font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg)}
.brand{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;background:#000;padding:14px 18px;border-bottom:1px solid #303030}
.logo{margin:0;line-height:0}
.logo img{display:block;width:48px;height:auto}
#theme{width:36px;height:36px;border:0;border-radius:50%;background:#2b2b2b;color:#e5e5e5;display:flex;align-items:center;justify-content:center}
.pathcard{margin:12px 0 0;border:1px solid var(--line);background:var(--card);border-radius:16px;padding:14px 16px;box-shadow:var(--shade)}
.pathhead{display:flex;align-items:center;gap:8px}
#crumb{flex:1;min-width:0;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:4px 0;font-size:15px;word-break:break-all}
#crumb .seg{color:var(--accent);font-weight:600;text-decoration:none}
#crumb .home{display:inline-flex;align-items:center}
#crumb .sep{color:var(--muted);margin:0 6px}
.statusline{display:flex;align-items:center;justify-content:safe center;gap:10px;margin-top:8px;white-space:nowrap;overflow-x:auto;font-size:12px;color:var(--muted)}
#stat{flex:none}
.hints{margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
.hints summary{display:flex;align-items:center;gap:6px;cursor:pointer;list-style:none;font-size:12px;font-weight:600;color:var(--ink)}
.hints summary svg{flex:none}
.hints summary::-webkit-details-marker{display:none}
.hints summary::after{content:"";width:6px;height:6px;margin-left:auto;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(45deg) translateY(-2px);opacity:.6}
.hints:not([open]) summary::after{transform:rotate(-45deg) translateY(1px)}
.hintgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.hint{border:1px solid var(--line);display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;min-width:0;padding:8px 10px;border-radius:10px;background:var(--field);box-shadow:var(--shade)}
.hint .chip{flex:none;background:var(--mark);color:var(--accent);font-weight:600}
.hintpath{min-width:0;font-size:12px;line-height:1.3;color:var(--muted);overflow-wrap:anywhere}
main{max-width:720px;margin:0 auto;padding:10px 12px calc(108px + env(safe-area-inset-bottom,0px))}
#list{margin-top:14px;border:1px solid var(--line);background:var(--card);border-radius:16px;overflow:hidden;min-height:120px;box-shadow:var(--shade)}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:12px 8px 12px 14px;border:0;border-bottom:1px solid var(--line);background:var(--card);text-align:left;font:inherit;color:inherit;cursor:pointer}
.row:last-child{border-bottom:0}
.row:active,.row.on{background:var(--press)}
.row.on .name{color:var(--accent)}
.tick{width:22px;height:22px;border-radius:7px;border:2px solid var(--muted);flex:none}
.row.on .tick{background:var(--green);border-color:transparent;position:relative}
.row.on .tick::after{content:"";position:absolute;left:7px;top:3px;width:5px;height:9px;border:solid var(--on-green);border-width:0 2px 2px 0;transform:rotate(45deg)}
#selbar{border:1px solid var(--line);position:fixed;left:calc(12px + env(safe-area-inset-left,0px));right:calc(12px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:8;display:flex;align-items:center;justify-content:flex-start;gap:8px;padding:10px 12px;background:var(--card);color:var(--ink);border-radius:16px;box-shadow:var(--shade)}
#selbar button{border:0;border-radius:10px;padding:8px 12px;background:var(--field);color:var(--ink);font-size:14px}
#sel-del{color:var(--danger)}
#sel-del:disabled{color:var(--muted)}
body.picking .fabs{visibility:hidden}
html[data-theme="night"] #selbar{border:1px solid #2c2c2c}
.mark{width:40px;height:40px;border-radius:12px;background:var(--mark);color:var(--accent);display:flex;align-items:center;justify-content:center;flex:none}
.meta{flex:1;min-width:0}
.name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.size{flex:none;font-size:12px;color:var(--muted);padding-right:4px}
.more{border:0;background:transparent;font-size:22px;line-height:1;padding:8px 12px;color:var(--muted)}
.empty,.loading{padding:36px 16px;text-align:center;color:var(--muted)}
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:160px}
.ring{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#msg{min-height:1.2em;margin:12px 0;font-size:14px;white-space:pre-wrap;text-align:left}
.fabs{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:6;display:flex;align-items:center;gap:10px}
.fabs button{width:54px;height:54px;border:1px solid transparent;border-radius:50%;background:var(--green);color:var(--on-green);box-shadow:var(--shade);display:flex;align-items:center;justify-content:center;font-size:32px;line-height:1}
#upchip{width:auto;height:36px;padding:0 12px;border-radius:999px;font-size:13px;font-weight:600}
#sheet{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.4);display:flex;align-items:flex-end}
.card{border:1px solid var(--line);width:100%;max-height:78vh;overflow:auto;background:var(--card);color:var(--ink);border-radius:18px 18px 0 0;padding:10px 16px calc(24px + env(safe-area-inset-bottom,0px));animation:rise .2s ease-out}
.handle{width:36px;height:4px;border-radius:4px;background:var(--muted);margin:2px auto 12px}
@keyframes rise{from{transform:translateY(100%)}to{transform:none}}
#sheet.center-dialog{align-items:center;justify-content:center;padding:24px 20px;background:rgba(0,0,0,.5)}
#sheet.center-dialog .card{display:flex;flex-direction:column;max-width:380px;max-height:calc(100% - 16px);overflow:hidden;border-radius:18px;padding:0;box-shadow:0 12px 36px rgba(0,0,0,.18);animation:appear .2s ease-out}
.dialog-title{flex:none;margin:0;padding:20px 24px 16px;border-bottom:1px solid var(--line);font-size:18px;line-height:1.5;font-weight:600;text-align:center;overflow-wrap:anywhere}
.dialog-text{min-height:0;overflow-y:auto;margin:0;padding:20px 24px;font-size:14px;line-height:1.75;color:var(--ink);white-space:pre-wrap;overflow-wrap:anywhere}
.dialog-actions{flex:none;display:flex;justify-content:center;gap:10px;padding:16px 24px 20px;border-top:1px solid var(--line)}
.dialog-actions button{min-width:96px;min-height:38px;max-width:100%;padding:8px 20px;border:0;border-radius:8px;background:var(--green);color:var(--on-green);font-size:14px;line-height:1.5;font-weight:600}
.dialog-actions button:active{opacity:.85}
.dialog-actions .secondary{background:var(--field);color:var(--ink);border:1px solid var(--line)}
.dialog-actions .danger{background:#b63f38;color:#fff}
.delete-paths{display:flex;flex-wrap:wrap;align-items:flex-start;gap:10px;margin-bottom:14px;padding:0;font-size:13px;line-height:1.5}
.delete-item{display:inline-flex;align-items:center;gap:6px;flex:0 1 auto;min-width:0;max-width:min(100%,320px);min-height:36px;padding:2px 4px 2px 12px;border:1px solid var(--line);border-radius:10px;background:var(--field);color:var(--ink)}
.delete-name{display:flex;align-items:center;flex:0 1 auto;min-width:0;padding:0;border:0;background:transparent;color:inherit;font:inherit;text-align:left}
.delete-start{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.delete-end{flex:none;white-space:nowrap}
.delete-item.expanded{max-width:100%}
.delete-item.expanded .delete-name{display:block;overflow-wrap:anywhere}
.delete-item.expanded .delete-start,.delete-item.expanded .delete-end{white-space:normal;overflow:visible}
.delete-remove{position:relative;display:flex;align-items:center;justify-content:center;flex:none;width:21px;height:21px;padding:0;border:1px solid var(--line);border-radius:50%;background:var(--card);color:var(--muted);box-shadow:0 1px 2px rgba(0,0,0,.14),inset 0 1px 0 rgba(255,255,255,.12)}
.delete-remove:active{background:var(--press);color:var(--ink);box-shadow:inset 0 1px 2px rgba(0,0,0,.12)}
.delete-remove svg{display:block;width:10.5px;height:10.5px;flex:none}
.delete-remove::after{content:"";position:absolute;inset:-9px;border-radius:50%}
.delete-warning{margin:0;color:var(--muted)}
.delete-error{margin:12px 0 0;color:var(--danger)}
.dialog-text .loading{padding:12px 0;min-height:120px}
.dialog-text .loading .detail{margin:0;width:100%}
.card.delete-card{background:var(--bg)}
.delete-box{padding:16px;border:1px solid var(--line);border-radius:14px;background:var(--card);box-shadow:var(--shade)}
.delete-card .dialog-title{padding:0 0 12px;font-size:16px;text-align:left}
.delete-card .dialog-text{overflow-y:visible;padding:14px 0 0;font-size:13px}
.delete-card .dialog-actions{margin-top:14px;padding:14px 0 0}
.delete-card .dialog-actions button{flex:1;min-height:44px;border-radius:12px;font-size:15px}
@keyframes appear{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
.ops{display:flex;flex-direction:column;gap:8px}
.op{min-height:48px;display:flex;align-items:center;justify-content:flex-start;gap:12px;width:100%;border:1px solid var(--line);border-radius:12px;padding:14px;font-size:15px;background:var(--field);color:var(--ink);text-align:left}
.op svg{flex:none}
.op.danger{color:var(--danger)}
.stitle{font-size:16px;font-weight:700;margin:4px 0 12px;word-break:break-all;text-align:left}
.titleline{display:flex;align-items:baseline;justify-content:flex-start;flex-wrap:wrap;gap:8px;margin:4px 0 12px}
.titleline .stitle{margin:0}
.titleline .aside{font-size:13px;font-weight:600;color:var(--muted);min-width:0;overflow-wrap:anywhere}
.field{width:100%;font-size:16px;padding:12px;border:1px solid var(--muted);border-radius:10px;background:var(--card);color:var(--ink);text-align:left}
.pair{display:flex;gap:8px;margin-top:12px}
.pair button{flex:1;border:1px solid var(--line);border-radius:12px;padding:14px;font-size:16px;background:var(--field);color:var(--ink);text-align:center}
.pair .go{background:var(--green);color:#111}
.pair .go:disabled{background:var(--field);color:var(--muted)}
.moverow{display:flex;align-items:center;justify-content:flex-start;gap:10px;width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--ink);padding:12px 4px;text-align:left;font:inherit}
.ubar{height:6px;border-radius:99px;background:var(--mark);overflow:hidden;margin:8px 0}
.ubar i{display:block;height:100%;background:var(--green)}
.ustat{display:flex;justify-content:flex-start;gap:8px;font-size:13px;color:var(--muted);text-align:left}
.card.savepick{background:var(--bg);padding-left:12px;padding-right:12px}
.savehead,.savebox{border:1px solid var(--line);background:var(--card);border-radius:14px;box-shadow:var(--shade)}
.savehead{display:flex;align-items:flex-start;gap:12px;padding:16px;margin-bottom:14px}
.savehead #up-where{flex:0 1 auto;justify-content:flex-start;text-align:left}
.savehead .stitle{margin:0;flex:none}
.savebox{padding:4px 12px 8px;min-height:160px}
.savebox.loading{padding:24px 12px}
#up-where{flex:1;min-width:0;display:flex;flex-wrap:wrap;align-items:center;font-size:15px;font-weight:600}
#up-where button{border:0;background:transparent;padding:2px 0;color:inherit;font:inherit;font-weight:600}
#up-where .sep{color:#b5b5b5;margin:0 4px}
#up-where .home{display:inline-flex;align-items:center}
.ufile{padding:10px 0;border-bottom:1px solid var(--line)}
.ufile .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:normal;overflow-wrap:anywhere}
.chips{display:flex;align-items:center;gap:6px;flex:none}
.chip{font-size:12px;line-height:1.3;padding:4px 8px;border-radius:6px;background:var(--field);color:var(--muted)}
.job-heading{display:flex;align-items:baseline;gap:12px;margin-bottom:8px}
.job-main{display:flex;align-items:center;gap:12px}
.job-info{flex:1;min-width:0}
.job-size{flex:none;font-size:12px;color:var(--muted);white-space:nowrap}
.job-progress{display:flex;align-items:center;gap:8px;min-height:32px;flex:none}
.job-progress .chips{margin-left:auto}
.job-speed{white-space:nowrap}
.job-progress-note{margin:10px 0 0;font-size:12px;color:var(--muted)}
.ufile .ubar{margin:10px 0 0}
.ufile .job-path{margin:0;line-height:1.5}
.ufile button,.ulink{border:1px solid var(--line);border-radius:8px;background:var(--field);color:var(--danger);box-shadow:var(--shade)}
.ufile button{font-size:12px;min-height:32px;padding:6px 10px;flex:none}
.ulink{display:block;width:100%;margin-top:14px;font-size:15px;padding:12px;border-radius:12px}
.autosw{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px;padding-top:8px;border-top:1px solid var(--line);font-size:13px;font-weight:600}
#autoclass{width:40px;height:24px;border:0;border-radius:99px;background:var(--mark);position:relative;flex:none;padding:0}
#autoclass::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:var(--shade)}
#autoclass[aria-checked="true"]{background:var(--green)}
#autoclass[aria-checked="true"]::after{transform:translateX(16px)}
.autonote{margin:6px 0 0;font-size:12px;line-height:1.4;color:var(--muted)}
.detail{font-size:12px;color:var(--muted);overflow-wrap:anywhere;white-space:normal;margin:6px 0}
#storage{flex:none}
button:disabled{opacity:.5;cursor:default}
.notice{padding:12px 14px;margin:10px 0;border-radius:12px;background:var(--field);color:var(--ink);font-size:13px;line-height:1.5;overflow-wrap:anywhere;white-space:pre-wrap;text-align:left;border:1px solid var(--line)}
.notice.bad{background:var(--error-bg);border-left:3px solid var(--danger)}
#msg:empty{display:none}
[hidden]{display:none!important}
#up-note{text-align:left;margin-bottom:12px}
#sheet-msg{flex:none}
.ufile .job-error{margin:10px 0 0}
.ufile .job-action:disabled{color:var(--muted)}
#up-summary{line-height:1.6}
#up-controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
#up-controls button{flex:1;margin:0;color:var(--danger)}
#up-controls #up-clear{color:var(--ink)}

button{cursor:pointer;touch-action:manipulation}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.field:focus{outline:2px solid var(--accent);outline-offset:2px}
.ufile[data-status="done"] .job-state,.ufile[data-status="saving"] .job-state{background:var(--mark);color:var(--accent)}
.ufile[data-status="fail"] .job-state{background:var(--error-bg);color:var(--danger)}
.ufile .job-action{color:var(--accent)}
.card.upload-card{background:var(--bg)}
.upload-head{padding:16px;margin-bottom:14px;border:1px solid var(--line);border-radius:14px;background:var(--card);box-shadow:var(--shade)}
.upload-head .titleline{justify-content:flex-start;margin:0;padding-bottom:12px;border-bottom:1px solid var(--line)}
.upload-head #up-note{margin:12px 0 0;text-align:left}
.upload-card .ufile{padding:14px;margin-bottom:10px;border:1px solid var(--line);border-radius:12px;background:var(--card);box-shadow:var(--shade)}
.upload-card .ufile:last-child{margin-bottom:0}
.conflict-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.conflict-head .stitle{margin:0}
.conflict-close{width:36px;height:36px;flex:none;border:0;border-radius:50%;background:var(--field);color:var(--muted);font-size:24px;line-height:1}
.conflict-file{margin:14px 0;font-size:14px;font-weight:600;overflow-wrap:anywhere}
.conflict-file .detail{font-weight:400}
.conflict-options{margin:0;padding:0;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.conflict-choice{display:flex;align-items:center;gap:12px;padding:12px;background:var(--field);border-bottom:1px solid var(--line);cursor:pointer}
.conflict-choice:last-child{border-bottom:0}
.conflict-choice input,.conflict-all input{width:18px;height:18px;margin:0;flex:none;accent-color:var(--green)}
.conflict-choice span{min-width:0;font-size:14px}
.conflict-choice strong{font-weight:600}
.conflict-choice .detail{display:block;margin:4px 0 0}
.conflict-all{display:flex;align-items:center;gap:10px;margin:14px 0;font-size:13px;color:var(--ink);cursor:pointer}
.conflict-footer{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.conflict-footer .pair{margin-top:12px}
@media(prefers-reduced-motion:reduce){.card,#sheet.center-dialog .card,.ring{animation:none}}
#sheet:not(.center-dialog) .card{border-top-color:transparent;background-image:linear-gradient(90deg,transparent 0%,var(--green) 18%,var(--green) 82%,transparent 100%);background-size:100% 1px;background-position:top center;background-repeat:no-repeat;background-origin:border-box}
</style>
</head>
<body>
<header class="brand">
  <h1 class="logo"><img src="cloudzao-logo.png" alt="CLOUD ZAO" width="1224" height="865"></h1>
  <button type="button" id="theme" aria-label="切换外观"></button>
</header>
<main>
<div class="pathcard">
  <div class="pathhead"><nav id="crumb"></nav></div>
  <div class="statusline"><span id="stat"></span><span id="storage" role="status" aria-live="polite">正在读取 SD 卡状态…</span></div>
  <details class="hints" open>
    <summary><svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M9 18h6M10 21h4M8.5 14.5A6 6 0 1 1 15.5 14c-.6.6-1.5 1.4-1.5 2.5h-4c0-1.1-.9-1.9-1.5-2.5z"/></svg>需注意上传的文件需放在指定目录下</summary>
    <div class="hintgrid">
      <div class="hint"><span class="chip">书籍</span><span class="hintpath">metalio/e-ink/books</span></div>
      <div class="hint"><span class="chip">壁纸</span><span class="hintpath">metalio/e-ink/wallpaper</span></div>
      <div class="hint"><span class="chip">字体</span><span class="hintpath">metalio/e-ink/fonts</span></div>
      <div class="hint"><span class="chip">待转换字体</span><span class="hintpath">metalio/e-ink/fonts_ttf</span></div>
    </div>
  </details>
  <div class="autosw"><span>自动分类</span><button type="button" id="autoclass" role="switch" aria-checked="false" aria-label="自动分类"></button></div>
  <p id="autoclass-note" class="autonote" hidden>开启后自动识别文件后缀，上传时自动保存到对应目录</p>
</div>
  <div id="list"></div>
  <p id="msg" class="notice" role="status" aria-live="polite"></p>
</main>
<div id="selbar" hidden>
  <span id="selcount">已选 0 项</span>
  <button type="button" id="sel-del">删除</button>
</div>
<div class="fabs">
  <button type="button" id="upchip" hidden>上传</button>
  <button type="button" id="refresh" aria-label="刷新">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M20 12a8 8 0 1 1-2.2-5.5M20 4.5V9h-4.5"/></svg>
  </button>
  <button type="button" id="add" aria-label="新建">+</button>
</div>
<div id="sheet" hidden><div class="card" id="card"></div></div>
<input id="file" type="file" multiple hidden>
<script>
let path = new URLSearchParams(location.search).get("path") || "/";
const msg = document.getElementById("msg");
const sheet = document.getElementById("sheet");
const card = document.getElementById("card");
let busy = false;
let deleting = false;
let enqueuing = false;
let reloadPending = false;
let sheetMode = "";
let moveItem = null;
let moveAt = "/";
let uploadAt = "/";
let seq = 0;
const queue = [];
let pumping = false;
let lastItems = [];
let selectMode = false;
const selected = new Set();
let conflicts = [];
let conflictBatchStart = 0;
let conflictChoice = "rename";
let conflictApplyAll = false;
let checkingSpace = false;
let takenNames = new Set();

        const result = await r.json();
        unknown = false;
        deleted += result.deleted || 0;
        if (result.error || result.remaining) throw Error(result.error || "部分项目未删除");
        finished++;
      }
    } catch(e) {
      error = e.message || "操作失败";
      if (unknown) error += "。当前操作结果未知，请刷新确认。";
    }
    finally { deleting = false; }
    selectMode = false; selected.clear(); paintSelect();
    await load();
    sheetMode = "delete-result";
    openCard('<div class="delete-box"><h2 class="dialog-title">' + (error ? "删除未全部完成" : "删除完成") + '</h2><div class="dialog-text">已删除 ' + deleted + ' 个文件或文件夹，已处理 ' + finished + ' / ' + paths.length + '。' + (error ? '<p class="delete-error">' + esc(error) + '</p>' : '') + '</div></div><div class="dialog-actions"><button type="button" id="del-close">确定</button></div>');
    document.getElementById("del-close").onclick = closeSheet;
  };
}

window.addEventListener("beforeunload", function (e) {
  if (pumping || deleting || conflicts.length) { e.preventDefault(); e.returnValue = ""; }
});
sheet.onclick = function (e) {
  if (e.target !== sheet) return;
  const dropSelect = sheetMode === "delete" && selectMode;
  closeSheet();
  if (dropSelect) exitSelect();
};
document.addEventListener("pointerdown", function (e) {
  if (!selectMode || sheetMode === "delete") return;
  if (e.target.closest("#selbar") || e.target.closest(".row")) return;
  exitSelect();
});
card.onclick = function (e) { e.stopPropagation(); };
document.getElementById("add").onclick = openAdd;
document.getElementById("refresh").onclick = function () { load(); };
document.getElementById("sel-del").onclick = askDeleteSelected;
document.getElementById("upchip").onclick = function () {
  if (conflicts.length) paintConflict();
  else { sheetMode = "upload"; paintUploads(); }
};
document.getElementById("file").onchange = function () {
  const files = Array.prototype.slice.call(this.files);
  this.value = "";
  if (files.length) enqueue(files);
};
const ICON_SUN = '<svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M5 5l1.8 1.8M17.2 17.2L19 19M19 5l-1.8 1.8M6.8 17.2L5 19"/></svg>';
const ICON_MOON = '<svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M15.5 3.2a8.2 8.2 0 1 0 5.3 12.6A7 7 0 0 1 15.5 3.2z"/></svg>';
function applyTheme(mode) {
  document.documentElement.setAttribute("data-theme", mode);
  document.getElementById("theme").innerHTML = mode === "night" ? ICON_SUN : ICON_MOON;
  try { localStorage.setItem("fileman-theme", mode); } catch (e) {}
}
let theme = "day";
try { theme = localStorage.getItem("fileman-theme") === "night" ? "night" : "day"; } catch (e) {}
applyTheme(theme);
document.getElementById("theme").onclick = function () {
  applyTheme(document.documentElement.getAttribute("data-theme") === "night" ? "day" : "night");
};
try { autoClass = localStorage.getItem("fileman-autoclass") === "1"; } catch (e) {}
setAutoClass(autoClass);
document.getElementById("autoclass").onclick = function () { setAutoClass(!autoClass); };
load();
</script>
</body>
