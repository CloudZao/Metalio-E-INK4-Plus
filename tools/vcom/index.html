ed:'Show log',clearSerial:'Clear',serialHint:'TX sent · RX received',close:'OK',unsupported:'Serial is unavailable. Use desktop Chrome / Edge on localhost or HTTPS.',connecting:'Connecting',reading:'Reading device',writing:'Writing and syncing',readOk:'Read successful',writeOk:'VCOM written successfully',invalid:'Invalid scan. Expected: panel-id -1.38. Use a negative voltage with up to two decimal places.',invalidMv:'Abnormal value: VCOM magnitude must be 1.0–3.0V (-3000 to -1000mv), in 10mv steps.',invalidPanel:'Panel ID allows letters, digits, hyphens and underscores, up to 79 characters.',comm:'Device communication failed',timeout:'Device response timed out. The write result is unknown. Scan again to retry, or read the device to check.',uncertain:'Result not confirmed',failed:'VCOM operation failed',readFailed:'VCOM read failed',writeFailed:'VCOM write failed',pending:'An operation is in progress. Wait before scanning again.',portBusy:'Cannot open port. Check the connection and other serial applications.',applied:'Driver value',notApplied:'Driver has not adopted the saved value yet',BH_NOT_READY:'Bluetooth chip is not ready',BH_BUSY:'Bluetooth chip is busy',BH_TX_FAILED:'Bluetooth UART send failed',BH_TIMEOUT:'Bluetooth chip response timed out',BH_WRITE_REJECTED:'Bluetooth chip rejected the write',BH_FLUSH_REJECTED:'Bluetooth Flash save failed',BH_READ_INVALID:'Invalid Bluetooth read response',BH_RECORD_INVALID:'No valid calibration record on Bluetooth chip',BH_VERIFY_MISMATCH:'Bluetooth readback does not match the write',DISPLAY_UNAVAILABLE:'Display worker unavailable',INVALID_VCOM:'Abnormal value: VCOM magnitude must be 1.0–3.0V, in 10mv steps',INVALID_VALUE:'Device rejected invalid parameters',INVALID_REQUEST:'Invalid device request',BUSY:'Device busy',LINE_TOO_LONG:'Request exceeds the size limit'}

const $ = id => document.getElementById(id);
let lang='zh', port=null, reader=null, writer=null, readTask=null, pending=null;
let scanComplete=true, resetting=false, cloudBusy=false;
let device=null, lastStatus='idle', sequence=crypto.getRandomValues(new Uint32Array(1))[0]%1000000000;
const t=key=>words[lang][key] || key;
const serverStorageKey='metalio.vcom.serverOrigin';
function rememberServer(){
 try{
  if($('rememberUrl').checked){
   if(!$('serverUrl').value.trim()){localStorage.removeItem(serverStorageKey);return;}
   localStorage.setItem(serverStorageKey,cloudEndpoint().origin);
  }else localStorage.removeItem(serverStorageKey);
 }catch(error){popup('failed',t(error.message==='CLOUD_URL_INVALID'?'CLOUD_URL_INVALID':'storageFailed'));}
}
function restoreServer(){
 try{
  const saved=localStorage.getItem(serverStorageKey);
  if(saved){$('serverUrl').value=saved;cloudEndpoint();$('rememberUrl').checked=true;}
 }catch{$('serverUrl').value='';$('rememberUrl').checked=false;}
}

function activity(key,detail=''){const line=document.createElement('div');line.textContent=new Date().toLocaleTimeString()+'  '+t(key)+(detail?' · '+detail:'');$('log').prepend(line);while($('log').children.length>30)$('log').lastChild.remove();}
let serialDirection='', serialBody=null, serialSize=0;
function clearSerial(){ $('serialLog').replaceChildren();serialDirection='';serialBody=null;serialSize=0; }
function serialPrint(direction,text){
 if(!$('serialEnabled').checked||!text)return;
 const root=$('serialLog'),follow=root.scrollHeight-root.scrollTop-root.clientHeight<40;
 if(direction!==serialDirection||!serialBody){
  const entry=document.createElement('div'),heading=document.createElement('div');
  heading.className='direction';heading.textContent=new Date().toLocaleTimeString('en-GB',{hour12:false,timeZone:'Asia/Shanghai'})+'.'+String(new Date().getMilliseconds()).padStart(3,'0')+' '+direction;
  serialBody=document.createElement('pre');entry.append(heading,serialBody);root.append(entry);serialDirection=direction;
 }
 serialBody.append(document.createTextNode(text));serialSize+=text.length;
 while(root.children.length>1&&(serialSize>131072||root.children.length>200)){
  serialSize-=root.firstChild.lastChild.textContent.length;root.firstChild.remove();
 }
 if(serialSize>131072){serialBody.textContent=serialBody.textContent.slice(-131072);serialSize=serialBody.textContent.length;}
 if(follow)root.scrollTop=root.scrollHeight;
}
let noticeTimer=null;
function dismissNotice(){clearTimeout(noticeTimer);noticeTimer=null;$('resultDialog').hidden=true;}
function resultTone(key){
 if(['readOk','writeOk','writeSynced','syncOk','queryOk'].includes(key))return 'success';
 if(['failed','readFailed','writeFailed','restartFailed','comm','uncertain','syncFailed','queryFailed'].includes(key))return 'error';
 return 'info';
}
function popup(title,message){
 clearTimeout(noticeTimer);const heading=t(title);
 $('resultDialog').dataset.tone=resultTone(title);
 $('dialogTitle').textContent=heading;
 $('dialogMessage').textContent=message.startsWith(heading+'\n')?message.slice(heading.length+1):message;
 $('resultDialog').hidden=false;
 noticeTimer=setTimeout(dismissNotice,5000);
}
function status(key){lastStatus=key;$('status').textContent=t(key);$('status').dataset.tone=resultTone(key);}
function controls(){const active=!!writer&&!!reader&&!pending&&!resetting&&!cloudBusy;$('connect').disabled=!!port;$('disconnect').disabled=!port||resetting||cloudBusy;$('write').disabled=!active;$('read').disabled=!active;$('sync').disabled=!active||!device||device.local_saved!==true||device.cloud==='synced';$('query').disabled=!active||!device;$('restart').disabled=!active;for(const id of ['panel','mv','serverUrl','rememberUrl'])$(id).disabled=!!pending||cloudBusy;$('connection').textContent=t(port?'connected':'disconnected');}
function render(){$('closeDialog').setAttribute('aria-label',lang==='zh'?'关闭提醒':'Dismiss notification');document.documentElement.lang=lang==='zh'?'zh-CN':'en';document.querySelectorAll('[data-i]').forEach(el=>el.textContent=t(el.dataset.i));status(lastStatus);controls();$('cloudStatus').textContent=cloudText(device?.cloud);if(device){$('identity').textContent=device.board_model+' · '+device.device_mac;$('saved').textContent=device.vcom_mv?device.vcom_mv+'mv':'—';$('applied').textContent=t('applied')+'：'+device.applied_mv+'mv';}}
function parseScan(raw){const match=raw.trim().match(/^([A-Za-z0-9_-]{1,79}?)\s*(-\d+(?:\.\d{1,2})?)$/);if(!match)throw Error('invalid');const mv=Math.round(Number(match[2])*1000);if(!validMv(mv))throw Error('invalidMv');return {panel_id:match[1],vcom_mv:mv};}
function validMv(mv){return Number.isInteger(mv)&&mv<=-1000&&mv>=-3000&&mv%10===0;}
function cloudText(value){return t(value==='synced'?'cloudSynced':value==='failed'?'cloudFailed':value==='syncing'?'cloudSyncing':'cloud');}
function validReply(message){return message&&Number.isInteger(message.id)&&typeof message.ok==='boolean'&&typeof message.code==='string'&&typeof message.board_model==='string'&&typeof message.device_mac==='string'&&Number.isInteger(message.vcom_mv)&&Number.isInteger(message.applied_mv);}
function cloudEndpoint(){
 let url;try{url=new URL($('serverUrl').value.trim());}catch{throw Error('CLOUD_URL_INVALID');}
 if(url.protocol!=='https:'||url.username||url.password||url.hash||url.search||url.pathname!=='/')throw Error('CLOUD_URL_INVALID');
 return new URL('/xiaozhi/api/metalio/vcom',url.origin);
}
async function cloudRequest(payload,query=false){
 const controller=new AbortController();let timer;
 try{
  const url=cloudEndpoint();if(query)url.searchParams.set('device_mac',payload.device_mac);
  timer=setTimeout(()=>controller.abort(),15000);
  const options={method:query?'GET':'POST',headers:{Accept:'application/json'},signal:controller.signal,credentials:'omit',redirect:'error'};
  if(!query){options.headers['Content-Type']='application/json';options.body=JSON.stringify(payload);}
  const response=await fetch(url.href,options);
  if(response.status!==200)throw Error('CLOUD_HTTP_FAILED');
  let result;try{result=await response.json();}catch(error){if(controller.signal.aborted)throw error;throw Error('CLOUD_RESPONSE_INVALID');}
  if(typeof result?.code!=='number')throw Error('CLOUD_RESPONSE_INVALID');
  if(result.code!==0)throw Error(query?'CLOUD_RESPONSE_FAILED':'CLOUD_REJECTED');
  const data=result.data;
  if(data?.board_model!==payload.board_model||typeof data?.device_mac!=='string'||data.device_mac.toLowerCase()!==payload.device_mac.toLowerCase()||!validMv(data.vcom_mv)||(!query&&data.vcom_mv!==payload.vcom_mv))throw Error('CLOUD_VERIFY_MISMATCH');
  return data;
 }catch(error){throw Error(controller.signal.aborted?'CLOUD_TIMEOUT':Object.hasOwn(words.en,error.message)?error.message:'CLOUD_CONNECTION_FAILED');}
 finally{clearTimeout(timer);}
}
async function queryCloud(){
 if(cloudBusy||pending||resetting||!device||!writer||!reader)return;
 const target=device;cloudBusy=true;status('querying');controls();activity('querying');$('cloudResult').textContent='';
 try{
  const data=await cloudRequest(target,true);
  $('cloudResult').textContent=t('cloudValue')+'：'+data.vcom_mv+'mv';status('queryOk');activity('queryOk');popup('queryOk',data.vcom_mv+'mv');
 }catch(error){status('queryFailed');activity('queryFailed',error.message);popup('queryFailed',t(error.message));}
 finally{cloudBusy=false;render();}
}
async function syncCloud(written=false){
 if(cloudBusy||pending||resetting)return;
 if(!device||device.local_saved!==true||!validMv(device.vcom_mv)){popup('syncFailed',t('NO_CALIBRATION'));return;}
 const target=device, payload={board_model:target.board_model,device_mac:target.device_mac,vcom_mv:target.vcom_mv};
 cloudBusy=true;target.cloud='syncing';status('syncing');render();activity('syncing');
 try{
  await cloudRequest(payload);
  target.cloud='synced';const key=written?'writeSynced':'syncOk';status(key);activity(key);popup(key,payload.vcom_mv+'mv');
 }catch(error){
  target.cloud='failed';const code=error.message;
  status('syncFailed');activity('syncFailed',code);popup('syncFailed',t(code));
 }finally{cloudBusy=false;render();}
}
function retryWrite(operation){
 if(operation.cmd!=='panel.set'||operation.retries>=3||!writer||!reader)return false;
 operation.waitingRetry=true;pending=operation;status('retrying');activity('retrying',(operation.retries+1)+'/3');controls();
 operation.timer=setTimeout(()=>{
  if(pending!==operation)return;
  pending=null;
  send('panel.set',{mv:operation.mv,panel:operation.panel,retries:operation.retries+1});
 },1000);
 return true;
}
function accept(message){
 if(!validReply(message)||!pending||pending.waitingRetry||message.id!==pending.id)return;
 const operation=pending;clearTimeout(operation.timer);pending=null;
 if(!device||device.device_mac!==message.device_mac)device={...message,local_saved:false,cloud:'not_requested'};
 const valueMatches=validMv(message.vcom_mv)&&(operation.cmd!=='panel.set'||(message.vcom_mv===operation.mv&&message.panel_id===operation.panel));
 if(message.ok&&(!valueMatches||message.code!=='OK'||message.local_saved!==true)){
  if(retryWrite(operation))return;
  status('uncertain');popup('comm',t('uncertain'));controls();return;
 }
 if(message.ok){
  device={...message,cloud:'not_requested'};$('mv').value=message.vcom_mv;
  if(typeof message.panel_id==='string')$('panel').value=message.panel_id;
  const result=operation.cmd==='panel.set'?'writeOk':'readOk';
  status(result);render();activity(result);
  if(operation.cmd==='panel.set')syncCloud(true);
  else popup(result,message.vcom_mv+'mv');
 }else{
  if(device)device.local_saved=false;
  activity(operation.cmd==='panel.set'?'writeFailed':'readFailed',/^[A-Z_]+$/.test(message.code)?message.code:'UNKNOWN');
  if(retryWrite(operation))return;
  const result=operation.cmd==='panel.set'?'writeFailed':'readFailed';
  status(result);popup(result,t(message.code)+(message.stage?' ('+message.stage+')':''));
 }
 controls();
}
async function readLoop(){
 const decoder=new TextDecoder();let buffer='';
 try{while(reader){const {value,done}=await reader.read();if(done)break;const text=decoder.decode(value,{stream:true});serialPrint('RX',text);buffer+=text;let nl;while((nl=buffer.indexOf('\n'))>=0){const line=buffer.slice(0,nl);buffer=buffer.slice(nl+1);const start=line.indexOf('@VCOM ');if(start>=0){try{accept(JSON.parse(line.slice(start+6).trim()));}catch{/* Ignore logs or interrupted frames. */}}}if(buffer.length>8192)buffer='';}}
 catch{if(port&&!resetting){activity('comm');}}
 finally{if(reader){reader.releaseLock();reader=null;}if(port&&!resetting){if(pending){clearTimeout(pending.timer);pending=null;}status('comm');controls();}}
}
async function connect(){
 if(!navigator.serial||!window.isSecureContext){popup('comm',t('unsupported'));return;}
 try{const selected=await navigator.serial.requestPort();await selected.open({baudRate:115200,flowControl:'none'});port=selected;await selected.setSignals({dataTerminalReady:false,requestToSend:false});writer=port.writable.getWriter();reader=port.readable.getReader();readTask=readLoop();device=null;$('cloudResult').textContent='';$('saved').textContent='—';$('applied').textContent='';status('idle');controls();activity('connected');await send('panel.get');}
 catch(error){if(error.name!=='NotFoundError'){popup('comm',t('portBusy'));await disconnect();}}
}
async function disconnect(){
 const old=port;port=null;if(pending){clearTimeout(pending.timer);pending=null;}
 try{if(reader)await reader.cancel();if(readTask)await readTask;if(writer){await writer.close();writer.releaseLock();}}catch{}finally{writer=null;reader=null;readTask=null;if(old)try{await old.close();}catch{}device=null;$('cloudResult').textContent='';$('identity').textContent=t('usbHint');status('disconnected');controls();}
}
async function send(cmd,retry=null){
 if(!writer||!reader){popup('comm',t('disconnected'));return;}if(pending||resetting||cloudBusy){popup('failed',t('pending'));return;}
 const request={cmd,id:++sequence};
 if(cmd==='panel.set'){const mv=retry?retry.mv:Number($('mv').value),panel=retry?retry.panel:$('panel').value.trim();if(!validMv(mv)){popup('failed',t('invalidMv'));return;}if(!/^[A-Za-z0-9_-]{1,79}$/.test(panel)){popup('failed',t('invalidPanel'));return;}request.vcom_mv=mv;request.panel_id=panel;if(device){device.local_saved=false;device.cloud='not_requested';}}
 const operation={id:request.id,cmd,mv:request.vcom_mv,panel:request.panel_id,retries:retry?retry.retries:0};pending=operation;
 operation.timer=setTimeout(()=>{if(pending!==operation)return;pending=null;activity('comm','DEVICE_TIMEOUT');if(retryWrite(operation))return;status('uncertain');controls();popup('comm',t('timeout'));},60000);
 status(cmd==='panel.set'?'writing':'reading');controls();activity(lastStatus);
 try{const text='@VCOM '+JSON.stringify(request)+'\r\n';serialPrint('TX',text);await writer.write(new TextEncoder().encode(text));}
 catch{if(pending===operation){clearTimeout(operation.timer);pending=null;activity('comm','SERIAL_TX_FAILED');if(retryWrite(operation))return;status('comm');controls();popup('comm',t('uncertain'));}}
}
async function restartDevice(){
 if(!port||!writer){popup('comm',t('disconnected'));return;}
 if(pending||resetting||cloudBusy){popup('failed',t('pending'));return;}
 const target=port;resetting=true;controls();status('restarting');activity('restarting');
 try{
  // 与 esptool 的硬复位一致：DTR 释放，RTS 拉低 EN 后再释放。
  serialPrint('CTRL','DTR=0 RTS=1\r\n');
  await target.setSignals({dataTerminalReady:false,requestToSend:true});
  await new Promise(resolve=>setTimeout(resolve,200));
  serialPrint('CTRL','DTR=0 RTS=0\r\n');
  await target.setSignals({dataTerminalReady:false,requestToSend:false});
  await new Promise(resolve=>setTimeout(resolve,200));
  popup('restarting',t('restartAccepted'));
 }catch{
  activity('restartFailed');popup('restartFailed',t('comm'));
 }finally{
  resetting=false;controls();status(writer&&reader?'idle':'disconnected');
 }
}
function scanKey(event){
 const code=event.code||'';
 if(/^Key[A-Z]$/.test(code)){const upper=!!event.shiftKey!==!!event.getModifierState?.('CapsLock');return upper?code.slice(3):code.slice(3).toLowerCase();}
 if(/^Digit[0-9]$/.test(code))return event.shiftKey?'':code.slice(5);
 if(/^Numpad[0-9]$/.test(code))return code.slice(6);
 if(code==='Minus'||code==='NumpadSubtract')return event.shiftKey&&code==='Minus'?'_':'-';
 if(code==='Period'||code==='NumpadDecimal')return event.shiftKey?'':'.';
 if(code==='Space')return ' ';
 return /^[A-Za-z0-9_. -]$/.test(event.key)?event.key:'';
}
function editScan(text,backspace=false,forward=false){
 const field=$('scan');let start=field.selectionStart??field.value.length,end=field.selectionEnd??start;
 if(start===end){if(backspace)start=Math.max(0,start-1);if(forward)end=Math.min(field.value.length,end+1);}
 field.setRangeText(text,start,end,'end');
}
function beginScan(){
 if(!scanComplete)return;
 $('scan').value='';$('panel').value='';$('mv').value='';scanComplete=false;
}
function submitScan(){
 if(pending||resetting||cloudBusy){popup('failed',t('pending'));return;}
 $('panel').value='';$('mv').value='';scanComplete=true;
 try{
  const result=parseScan($('scan').value);$('panel').value=result.panel_id;$('mv').value=result.vcom_mv;
  if($('autoWrite').checked)send('panel.set');
 }catch(error){popup('failed',t(error.message));}
 $('scan').select();
}
$('scan').addEventListener('paste',event=>{
 event.preventDefault();if(pending||resetting||cloudBusy){popup('failed',t('pending'));return;}
 scanComplete=true;beginScan();const text=event.clipboardData.getData('text').trim();
 if(!/^[A-Za-z0-9_. \-]+$/.test(text)){popup('failed',t('invalid'));return;}
 editScan(text);
});
$('scan').addEventListener('keydown',event=>{
 if(event.ctrlKey||event.altKey||event.metaKey)return;
 const enter=event.code==='Enter'||event.code==='NumpadEnter'||event.key==='Enter';
 if(!enter){
  if(event.key==='Backspace'||event.key==='Delete'){event.preventDefault();editScan('',event.key==='Backspace',event.key==='Delete');return;}
  const text=scanKey(event);if(text){event.preventDefault();if(pending||resetting||cloudBusy)return;beginScan();editScan(text);}return;
 }
 event.preventDefault();submitScan();
});
$('rememberUrl').onchange=rememberServer;$('serverUrl').onchange=rememberServer;
$('clearSerial').onclick=clearSerial;$('serialEnabled').onchange=()=>{serialDirection='';serialBody=null;};
$('restart').onclick=restartDevice;
$('connect').onclick=connect;$('disconnect').onclick=disconnect;$('write').onclick=()=>send('panel.set');$('read').onclick=()=>send('panel.get');$('sync').onclick=()=>syncCloud();$('query').onclick=queryCloud;$('language').onchange=()=>{lang=$('language').value;render();};$('closeDialog').onclick=()=>{dismissNotice();$('scan').focus();};
if(navigator.serial)navigator.serial.addEventListener('disconnect',event=>{if(event.target===port)disconnect();});
restoreServer();
render();
</script>
