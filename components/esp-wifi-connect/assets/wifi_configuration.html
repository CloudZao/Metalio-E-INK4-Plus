<!DOCTYPE html>
<html>
<head>
    <title>MetalioEInk4Plus — Network Configuration</title>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy" content="referrer no-referrer">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <style type="text/css">
        :root, [data-theme="light"] {
            --bg: #f5f5f7;
            --surface: #ffffff;
            --surface-hover: #f0f0f2;
            --border: #e5e5ea;
            --text: #1d1d1f;
            --text-secondary: #86868b;
            --accent: #0071e3;
            --accent-hover: #0077ed;
            --accent-dim: rgba(0, 113, 227, 0.08);
            --error: #ff3b30;
            --success: #34c759;
            --overlay: rgba(255, 255, 255, 0.72);
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
            --input-bg: #f5f5f7;
            --segment-bg: #e5e5ea;
        }
        [data-theme="dark"] {
            --bg: #0a0a0b;
            --surface: #141416;
            --surface-hover: #1c1c1f;
            --border: #2a2a2e;
            --text: #f5f5f7;
            --text-secondary: #8e8e93;
            --accent: #0a84ff;
            --accent-hover: #409cff;
            --accent-dim: rgba(10, 132, 255, 0.12);
            --error: #ff453a;
            --success: #30d158;
            --overlay: rgba(0, 0, 0, 0.72);
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            --input-bg: #1c1c1f;
            --segment-bg: #1c1c1f;
        }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg);
            background-image:
                radial-gradient(ellipse 90% 60% at 50% -30%, var(--accent-dim), transparent 70%),
                radial-gradient(ellipse 50% 40% at 100% 80%, var(--accent-dim), transparent 60%);
            color: var(--text);
            min-height: 100vh;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }
        .app {
            max-width: 420px;
            margin: 0 auto;
            padding: 0 20px 48px;
            min-height: 100vh;
        }
        .toolbar {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 8px;
            padding: 16px 0 0;
        }
        .hero {
            text-align: center;
            padding: 32px 8px 36px;
        }
        .hero-mark {
            font-size: 30px;
            font-weight: 700;
            letter-spacing: -0.04em;
            line-height: 1.1;
        }
        .hero-tagline {
            margin-top: 10px;
            font-size: 15px;
            color: var(--text-secondary);
            font-weight: 400;
        }
        .panel {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: var(--shadow);
        }
        .panel-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
            gap: 12px;
        }
        .panel-title {
            font-size: 15px;
            font-weight: 600;
            color: var(--text);
        }
        .scan-badge {
            font-size: 12px;
            font-weight: 500;
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }
        .scan-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--accent);
            animation: pulse 1.4s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.35; transform: scale(0.85); }
        }
        .connect-panel { margin-bottom: 16px; }
        .field-input:read-only { cursor: default; }
        .field-input:read-only:not(:placeholder-shown) { opacity: 1; }
        .field-input:read-only:placeholder-shown { color: var(--text-secondary); }
        .saved-panel.is-hidden { display: none; }
        .saved-panel .panel-title { margin-bottom: 12px; }
        .icon-btn {
            width: 36px;
            height: 36px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--surface);
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.15s, color 0.15s, border-color 0.15s;
            box-shadow: var(--shadow);
        }
        .icon-btn:hover { background: var(--surface-hover); color: var(--text); }
        .icon-btn svg { width: 18px; height: 18px; }
        .lang-select {
            height: 36px;
            padding: 0 8px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--surface);
            color: var(--text);
            font-size: 13px;
            cursor: pointer;
            max-width: 110px;
            box-shadow: var(--shadow);
        }
        .field { margin-bottom: 14px; }
        .field:last-child { margin-bottom: 0; }
        .field-label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }
        .field-input {
            width: 100%;
            height: 48px;
            padding: 0 16px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: var(--input-bg);
            color: var(--text);
            font-size: 16px;
            outline: none;
            transition: border-color 0.15s, box-shadow 0.15s;
        }
        .field-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-dim);
        }
        .password-wrap {
            position: relative;
        }
        .password-wrap .field-input { padding-right: 44px; }
        .pwd-toggle {
            position: absolute;
            right: 4px;
            top: 50%;
            transform: translateY(-50%);
            width: 36px;
            height: 36px;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .pwd-toggle:hover { color: var(--text); }
        .pwd-toggle svg { width: 18px; height: 18px; }
        .btn-primary {
            width: 100%;
            height: 52px;
            border: none;
            border-radius: 14px;
            background: var(--accent);
            color: #fff;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s, opacity 0.15s, transform 0.1s;
            margin-top: 4px;
            letter-spacing: 0.01em;
        }
        .btn-primary:active:not(:disabled) { transform: scale(0.98); }
        .btn-primary:hover:not(:disabled) { background: var(--accent-hover); }
        .btn-primary:disabled { opacity: 0.45; cursor: not-allowed; }
        .error-msg {
            color: var(--error);
            font-size: 13px;
            text-align: center;
            margin-bottom: 12px;
            min-height: 0;
        }
        .error-msg:empty { display: none; }
        .network-list { display: flex; flex-direction: column; gap: 6px; }
        .network-item {
            display: flex;
            align-items: center;
            gap: 14px;
            width: 100%;
            padding: 14px 16px;
            border: 1px solid transparent;
            border-radius: 14px;
            background: var(--input-bg);
            color: var(--text);
            cursor: pointer;
            text-align: left;
            transition: background 0.15s, border-color 0.15s, transform 0.1s;
        }
        .network-item:active { transform: scale(0.99); }
        .network-item:hover { background: var(--surface-hover); }
        .network-item.selected {
            border-color: var(--accent);
            background: var(--accent-dim);
        }
        .network-info { flex: 1; min-width: 0; }
        .network-name {
            display: block;
            font-size: 15px;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .network-meta { font-size: 12px; color: var(--text-secondary); }
        .signal-bars {
            display: flex;
            align-items: flex-end;
            gap: 2px;
            height: 14px;
            flex-shrink: 0;
        }
        .signal-bars span {
            width: 3px;
            border-radius: 1px;
            background: var(--border);
        }
        .signal-bars span.on { background: var(--accent); }
        .signal-bars span:nth-child(1) { height: 4px; }
        .signal-bars span:nth-child(2) { height: 7px; }
        .signal-bars span:nth-child(3) { height: 10px; }
        .signal-bars span:nth-child(4) { height: 14px; }
        .network-lock { color: var(--text-secondary); flex-shrink: 0; }
        .network-lock svg { width: 14px; height: 14px; }
        .scanning-text {
            text-align: center;
            color: var(--text-secondary);
            font-size: 14px;
            padding: 20px 0;
        }
        .scan-hint {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 10px;
        }
        .saved-list { list-style: none; display: flex; flex-direction: column; gap: 6px; }
        .saved-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 14px;
            border-radius: 12px;
            background: var(--input-bg);
        }
        .saved-name {
            flex: 1;
            font-size: 14px;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .saved-badge {
            font-size: 11px;
            font-weight: 600;
            color: var(--accent);
            background: var(--accent-dim);
            padding: 2px 8px;
            border-radius: 6px;
            flex-shrink: 0;
        }
        .saved-actions { display: flex; gap: 4px; flex-shrink: 0; }
        .saved-actions button {
            width: 32px;
            height: 32px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--surface);
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.15s, color 0.15s;
        }
        .saved-actions button:hover:not(:disabled) { background: var(--surface-hover); color: var(--text); }
        .saved-actions button:disabled { opacity: 0.4; cursor: not-allowed; }
        .saved-actions button svg { width: 14px; height: 14px; }
        .toast {
            position: fixed;
            bottom: 32px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: var(--surface);
            color: var(--text);
            border: 1px solid var(--border);
            padding: 12px 24px;
            border-radius: 12px;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s, transform 0.25s;
            font-size: 14px;
            font-weight: 500;
            box-shadow: var(--shadow);
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        .loading-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: var(--overlay);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }
        .loading-overlay.show { display: flex; }
        .loading-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 32px 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            box-shadow: var(--shadow);
        }
        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        .loading-text { color: var(--text); font-size: 15px; font-weight: 500; }
        @keyframes spin { to { transform: rotate(360deg); } }
        [data-theme="dark"] .theme-icon-light { display: none; }
        [data-theme="light"] .theme-icon-dark { display: none; }
    </style>
</head>

        <section class="panel connect-panel">

            <form action="/submit" method="post" onsubmit="submitForm(event)">
                <div class="field">

        // ========== Theme ==========

        function escHtml(s) {
            const d = document.createElement('div');
            d.textContent = s;
            return d.innerHTML;
        }

        function applyTheme(theme) {
            document.body.setAttribute('data-theme', theme);
            localStorage.setItem('preferred_theme', theme);
        }

        function toggleTheme() {
            const current = document.body.getAttribute('data-theme') || 'light';
            applyTheme(current === 'dark' ? 'light' : 'dark');
        }

        function getSignalLevel(rssi) {
            if (rssi >= -50) return 4;
            if (rssi >= -60) return 3;
            if (rssi >= -70) return 2;
            return 1;
        }

        function renderSignalBars(level) {
            let html = '<div class="signal-bars">';
            for (let i = 1; i <= 4; i++) {
                html += '<span class="' + (i <= level ? 'on' : '') + '"></span>';
            }
            html += '</div>';
            return html;
        }

        function togglePassword() {
            const input = document.getElementById('password');
            input.type = input.type === 'password' ? 'text' : 'password';
        }

        function t(key) {
            const lang = document.getElementById('language').value;
            return (translations[lang] && translations[lang][key]) ||
                   (translations['en-US'] && translations['en-US'][key]) || key;
        }

        // ========== Helper Functions ==========
        
        /**
         * Get supported language code from browser language
         */
        function getSupportedLanguage(lang) {
            // First try exact match
            if (languageMap[lang]) {
                return languageMap[lang];
            }
            // Then try to match only the main language code
            const mainLang = lang.split('-')[0];
            if (languageMap[mainLang]) {
                return languageMap[mainLang];
            }
            // If no match, return English
            return 'en-US';
        }

        /**
         * Change the page language
         */
        function changeLanguage() {
            const lang = document.getElementById('language').value;
            
            // Check if language is valid
            if (!translations[lang]) {
                console.warn(`Unsupported language: ${lang}, defaulting to English`);
                document.getElementById('language').value = 'en-US';
                return changeLanguage();
            }
            
            // Set page title
            document.title = 'MetalioEInk4Plus — ' + translations[lang].title;
            
            // Update text content
            document.querySelectorAll('[data-lang]').forEach(element => {
                const key = element.getAttribute('data-lang');
                element.textContent = t(key);
            });

            document.querySelectorAll('[data-lang-placeholder]').forEach(element => {
                const key = element.getAttribute('data-lang-placeholder');
                element.placeholder = t(key);
            });
            
            // Legacy: input submit buttons with data-lang-value
            document.querySelectorAll('[data-lang-value]').forEach(element => {
                const key = element.getAttribute('data-lang-value');
                element.value = t(key);
            });
            
            // Update AP list hint if present
            const hint = document.getElementById('ap_hint');
            if (hint) {
                hint.textContent = support5G ? t('select_wifi_5g') : t('select_wifi');
            }
            
            // Save language preference
            localStorage.setItem('preferred_language', lang);
        }

        // ========== Wi-Fi List Management ==========
        
        /**
         * Render saved Wi-Fi list
         */
        function renderSavedList(data) {
            const savedListContainer = document.getElementById('saved_list_container');
            const savedList = document.getElementById('saved_list');
            savedList.innerHTML = '';
            
            data.forEach((ssid, index) => {
                const li = document.createElement('li');
                li.className = 'saved-item';
                
                let html = '<span class="saved-name">' + ssid + '</span>';
                if (index === 0) {
                    html += '<span class="saved-badge">' + t('default_badge') + '</span>';
                }
                html += '<span class="saved-actions">';
                if (index > 0) {
                    html += '<button type="button" onclick="setDefaultItem(this, ' + index + ')" title="Set default">' +
                        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>';
                }
                html += '<button type="button" onclick="deleteItem(this, ' + index + ')" title="Delete">' +
                    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg></button>';
                html += '</span>';
                
                li.innerHTML = html;
                savedList.appendChild(li);
            });
            
            savedListContainer.classList.toggle('is-hidden', data.length === 0);
        }

        function selectNetwork(name) {
            ssid.value = name;
            error.textContent = '';
            document.getElementById('password').focus();
        }

        /**
         * Delete saved Wi-Fi network
         */
        function deleteItem(item, index) {
            item.disabled = true;
            fetch('/saved/delete?index=' + index)
                .then(response => response.json())
                .then(data => {
                    loadSavedList();
                });
        }

        /**
         * Set default Wi-Fi network (move to top)
         */
        function setDefaultItem(item, index) {
            item.disabled = true;
            fetch('/saved/set_default?index=' + index)
                .then(response => response.json())
                .then(data => {
                    loadSavedList();
                });
        }

        /**
         * Load saved Wi-Fi list from server
         */
        function loadSavedList() {
            fetch('/saved/list')
                .then(response => response.json())
                .then(data => {
                    renderSavedList(data);
                });
        }

        /**
         * Load available Wi-Fi networks
         */
        function loadAPList() {
            if (button.disabled) {
                return;
            }

            const apList = document.getElementById('ap_list');
            const hasExisting = apList.querySelector('.network-item') !== null;
            const scanText = document.getElementById('scan_text');

            if (!hasExisting) {
                apList.innerHTML = '<p class="scanning-text">' + t('scanning') + '...</p>';
            }
            if (scanText) scanText.textContent = t('scanning');

            fetch('/scan')
                .then(response => response.json())
                .then(data => {
                    support5G = data.support_5g;
                    const currentSsid = ssid.value;
                    const hint = document.getElementById('ap_hint');
                    if (hint) {
                        hint.textContent = support5G ? t('select_wifi_5g') : t('select_wifi');
                    }

                    if (data.aps.length === 0) {
                        apList.innerHTML = '<p class="scanning-text">' + t('scanning') + '...</p>';
                    } else {
                        let html = '<div class="network-list">';
                        data.aps.forEach(ap => {
                            const level = getSignalLevel(ap.rssi);
                            const selected = ap.ssid === currentSsid ? ' selected' : '';
                            const lockIcon = ap.authmode === 0
                                ? '<span class="network-lock"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/></svg></span>'
                                : '<span class="network-lock"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span>';

                            html += '<button type="button" class="network-item' + selected + '" data-ssid="' +
                                escHtml(ap.ssid) + '">' +
                                '<div class="network-info"><span class="network-name">' + escHtml(ap.ssid) + '</span>' +
                                '<span class="network-meta">' + ap.rssi + ' dBm</span></div>' +
                                renderSignalBars(level) + lockIcon + '</button>';
                        });
                        html += '</div>';
                        apList.innerHTML = html;

                        apList.querySelectorAll('.network-item').forEach(item => {
                            item.addEventListener('click', () => {
                                apList.querySelectorAll('.network-item').forEach(n => n.classList.remove('selected'));
                                item.classList.add('selected');
                                selectNetwork(item.getAttribute('data-ssid'));
                            });
                        });
                    }

                    setTimeout(loadAPList, 5000);
                })
                .catch(err => {
                    console.error('Error:', err);
                    setTimeout(loadAPList, 5000);
                });
        }

        // ========== Form Submission ==========
        
        /**
         * Submit Wi-Fi connection form
         */
        async function submitForm(event) {
            event.preventDefault();
            button.disabled = true;
            error.textContent = '';

            // Show loading animation
            const loadingOverlay = document.getElementById('loadingOverlay');
            loadingOverlay.classList.add('show');

            const payload = {
                ssid: ssid.value,
                password: document.getElementById('password').value
            };

            try {
                const response = await fetch('/submit', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();
                if (!data.success) {
                    throw new Error(data.error || 'Connection failed');
                }

                // Connection successful, redirect to done page
                button.disabled = false;
                window.location.href = '/done.html';
            } catch (err) {
                // Hide loading animation on error
                loadingOverlay.classList.remove('show');
                error.textContent = err.message;
                button.disabled = false;
            }
        }

        // ========== UI Functions ==========

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        // ========== Initialization ==========
        
        /**
         * Initialize page on DOM load
         */
        document.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('preferred_theme') || 'light';
            applyTheme(savedTheme);

            const urlParams = new URLSearchParams(window.location.search);
            const langParam = urlParams.get('lang');
            
            // Get browser language
            const browserLang = navigator.language || navigator.userLanguage;
            
            // Priority: URL parameter > local storage > browser language setting
            const savedLang = langParam || 
                             localStorage.getItem('preferred_language') || 
                             getSupportedLanguage(browserLang);
            
            document.getElementById('language').value = savedLang;
            changeLanguage();
            loadSavedList();
            loadAPList();
        });

        window.addEventListener('pageshow', (event) => {
            if (event.persisted) {
                loadSavedList();
            }
        });

        ssid.addEventListener('touchstart', () => {
            ssid.removeAttribute('readonly');
            ssid.focus();
        }, { once: true });
    </script>
